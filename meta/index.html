<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</head>
<body>
    <section class="section page-header">
        <h1 class="meta-title">Meta</h1>
        <p class="page-description">This page includes stats about the code of this website.</p>
    </section>

    <section class="section">
        <div id="stats">
            <h2 class="section-title">Summary</h2>
        </div>
        <div>
            <h2 class="section-title">Commits by time of day</h2>
            <div id="scatter-plot"></div>
            <dl id="commit-tooltip" class="info tooltip" hidden> <!-- hide by default -->
                <dt>Commit</dt>
                <dd>
                  <a href="" id="commit-link" target="_blank"></a>
                </dd>
              
                <dt>Date</dt>
                <dd id="commit-date"></dd>
              
                <dt>Time</dt>
                <dd id="commit-time"></dd>

                <dt>Author</dt>
                <dd id="commit-author"></dd>

                <dt>Lines edited</dt>
                <dd id="commit-lines"></dd>
            </dl>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
        
    </section>

</body>
</html>
